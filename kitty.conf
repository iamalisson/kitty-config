
# Nord color theme (background overridden below to match the wallpaper)
include theme.conf

# Open fullscreen on launch (state only, no windows/layout — see session.conf)
startup_session session.conf

# Font ---------------------------------------------------------------------

font_family      Hack Nerd Font Mono
bold_font        Hack Nerd Font Mono Bold
italic_font      Hack Nerd Font Mono Italic
bold_italic_font Hack Nerd Font Mono Bold Italic
font_size        13.0
adjust_line_height 110%
disable_ligatures never

# Cursor ---------------------------------------------------------------------

cursor_shape           beam
cursor_beam_thickness  1.5
cursor_blink_interval  0.5
cursor_trail           3
cursor_trail_decay     0.1 0.4

# Scrollback / bell ------------------------------------------------------------

scrollback_lines  10000
enable_audio_bell no

# Window layout ---------------------------------------------------------------

window_padding_width        10
single_window_padding_width -1
confirm_os_window_close     0
hide_window_decorations     no

# Tab bar ---------------------------------------------------------------------

tab_bar_edge          top
tab_bar_style         slant
tab_bar_align         left
tab_bar_margin_height 6.0 0.0

# Default template plus the tab's project dir (basename of cwd) in gray
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title} {fmt.fg.gray}{tab.active_wd.rsplit('/', 1)[-1] or '/'}"

# Window layouts: splits first, so it is the default (dynamic tiling).
enabled_layouts splits,stack,tall,grid

# Keyboard shortcuts ------------------------------------------------------------

# Every "open something new" key inherits the current window's cwd.
# ctrl+shift+enter is kitty's own default new-window key; unbound it opens
# in $HOME instead. ctrl+shift+space is often eaten by fcitx5, so bind both.
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+n     launch --type=os-window --os-window-state=fullscreen --cwd=current
map ctrl+shift+space new_window_with_cwd

map ctrl+shift+z toggle_layout stack

# Fuzzy switch to a tab: type part of its path or title, Enter jumps there.
# Also logs each closed window's cwd (via dir_history.py watcher) so the
# picker's history mode (ctrl+r inside it) can reopen a dir you closed.
watcher dir_history.py
map ctrl+shift+p kitten tab_picker.py

# Background wallpaper ---------------------------------------------------------

# Minimalist blue mountain/tree artwork, slightly darkened. Shipped
# alongside this config so it travels with it (relative paths resolve
# against the kitty config dir).
background_image        wallpaper.png
background_image_layout scaled
background_image_linear yes
background_tint         0.35
background_tint_gaps    0.5

# Match the terminal background to the wallpaper's own background so the
# padding/letterbox edges blend in seamlessly.
background #272c36

# Misc -------------------------------------------------------------------------

shell_integration enabled
update_check_interval 0

# tab_picker.py and dir_history.py's "open" mode need this (kitty @ ls / launch).
allow_remote_control yes
